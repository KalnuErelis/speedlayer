<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpeedLayer Manual Test</title>
    <style>
      body {
        color: #161616;
        background: #f6f7f8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 32px;
        box-sizing: border-box;
        overflow-x: hidden;
      }

      main {
        width: min(760px, 100%);
        max-width: 760px;
        margin: 0 auto;
        min-width: 0;
      }

      h1 {
        font-size: 32px;
        line-height: 1.1;
        margin: 0 0 20px;
        max-width: 100%;
      }

      video {
        display: block;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        aspect-ratio: 16 / 9;
        background: #101418;
      }

      p {
        line-height: 1.5;
        max-width: 100%;
        overflow-wrap: anywhere;
      }

      @media (max-width: 520px) {
        body {
          padding: 24px 18px;
        }

        main {
          width: calc(100vw - 36px);
        }

        h1,
        p,
        video {
          width: calc(100vw - 36px);
          max-width: calc(100vw - 36px);
        }

        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SpeedLayer Manual Test</h1>
      <p>
        Tone and silence test video.<br>
        Load SpeedLayer and start playback.<br>
        Open the popup.
      </p>
      <video controls src="./test-media/silence-pattern.mp4"></video>
    </main>
  </body>
</html>
